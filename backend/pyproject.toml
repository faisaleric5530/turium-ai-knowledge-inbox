[project]
name = "turium-backend"
version = "0.1.0"
description = "Turium AI Knowledge Inbox - FastAPI backend (ingest, semantic search, RAG)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.163.1",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "openai>=3.52.0",
    "pydantic-settings>=2.16.3",
    "structlog>=26.1.0",
    "trafilatura>=2.3.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
